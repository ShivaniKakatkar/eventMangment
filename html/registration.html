<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registration - Magnum 2K25</title>
  <link rel="stylesheet" href="../css&js/style.css">
  <style>
    .container {
      display: flex;
      justify-content: center;
      width: 680px;
      height: 680px;
      background-color: #37304A;    
      text-align: center;
      margin: 50px auto;
      border-radius: 30px;
      box-shadow: 0 0 30px rgba(0, 0, 0, .2);
    }

    .form-box {
      justify-content: center;
      width: 100%;
      display: flex;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 55px;
    }

    form {
      width: 100%;
    }

    .container h1 {
      color: #F8F8F8;
      font-size: 50px;
      margin: -10px 0;
    }

    .input-box {
      display: flex;
      justify-content: center;
      margin: 30px 0;
    }

    .input-box input {
      width: 100%;
      padding: 15px 50px;
      background: #F8F8F8;
      border-radius: 8px;
      border: none;
      outline: none;

      font-size: 16px;
      color: #151212;
      font-weight: 500;
    }

    .input-box input::placeholder {
      color: #979595;
      font-weight: 400;
    }


    .btn {
      width: 100%;
      height: 40px;
      background: #6C5CE7;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, .1);
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <h1>MAGNUM</h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="#">Registration</a>
    </nav>
  </header>
  <div class="container">
    <div class="form-box">

      <form onsubmit="return validateForm()" action="" class="form">
        <h1>Registration</h1>
        <div class="input-box">
          <input type="text" id="name" placeholder="*Fullname" required>

        </div>
        <div class="input-box">
          <input type="text" id="rno" placeholder="*RollNo" required>

        </div>
        <div class="input-box">
          <input type="text" id="clssem" placeholder="*Class/Sem" required>
        </div>

        <div class="input-box">
          <input type="text" id="team" placeholder="*Team No & Team Name" required>
        </div>
        <div class="input-box">
          <input type="text" id="event" list="events" placeholder="*Event" required>

        </div>
        <datalist id="events">
          <option value="Coding"></option>
          <option value="Cyber Security"></option>
          <option value="Quiz"></option>
          <option value="Communication"></option>
        </datalist>
        <button type="submit" class="btn" id="regbtn">Submit</button>

      </form>
    </div>
  </div>

  <script>
    function validateForm() {
      // Get form fields
      var name = document.getElementById("name").value.trim();
      var rno = document.getElementById("rno").value.trim();
      var clssem = document.getElementById("clssem").value.trim();
      var team = document.getElementById("team").value.trim();
      var event = document.getElementById("event").value.trim();

      // Check if any field is empty
      if(name === "" || rno === "" || clssem === "" || team === "" || event === "") {
        alert("Please fill in all the fields before submitting.");
        return false; // stops the form from submitting
      } else {
        alert("Registration Successful");
        return true;
      }
    }
  </script>
</body>

</html>
